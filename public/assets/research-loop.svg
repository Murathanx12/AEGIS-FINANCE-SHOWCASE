<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="title desc"><title id="title">Aegis research loop</title><desc id="desc">Sources feed an evidence record, hypotheses, paper evaluation and retained findings. A fixed geometric diagram of the research workflow, not a live system status.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#c9d6e0" stroke-width=".5"/></pattern></defs><rect width="600" height="540" rx="8" fill="#edf3f8"/><rect x="25" y="20" width="550" height="475" rx="6" fill="url(#grid)"/><g fill="none" stroke="#96aec1"><circle cx="300" cy="265" r="183"/><circle cx="300" cy="265" r="129" stroke-dasharray="3 8"/><path d="M300 82v58m183 125h-55M300 448v-55M117 265h55"/></g><g fill="none" stroke="#245bb0" stroke-width="2"><path d="M300 82a183 183 0 0 1 178 140"/><path d="m468 214 10 10 5-14"/><path d="M300 448a183 183 0 0 1-178-140"/><path d="m132 316-10-10-5 14"/></g><g fill="#edf3f8" stroke="#10283c" stroke-width="1.5"><circle cx="300" cy="82" r="7"/><circle cx="483" cy="265" r="7"/><circle cx="300" cy="448" r="7"/><circle cx="117" cy="265" r="7"/></g><rect x="210" y="190" width="180" height="150" rx="5" fill="#10283c"/><path d="M273 222h54m-54 13h54m-54 13h35" stroke="#9fbed8" stroke-width="2"/><text x="300" y="287" fill="#edf3f8" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22">Evidence record</text><text x="300" y="311" fill="#a9c2d6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12">Source · claim · outcome</text><g font-family="Segoe UI,Arial,sans-serif" fill="#10283c" font-size="16"><text x="300" y="56" text-anchor="middle">Collect sources</text><text x="499" y="260">Form a</text><text x="499" y="280">hypothesis</text><text x="300" y="481" text-anchor="middle">Evaluate paper outcomes</text><text x="101" y="260" text-anchor="end">Retain</text><text x="101" y="280" text-anchor="end">findings</text></g></svg>
